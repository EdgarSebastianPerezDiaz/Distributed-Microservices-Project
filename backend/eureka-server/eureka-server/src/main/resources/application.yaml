# ============================================================
# EUREKA SERVER - SERVIDOR DE REGISTRO DE MICROSERVICIOS
# ============================================================
# Este servicio actúa como "directorio telefónico" donde todos
# los microservicios se registran para encontrarse entre sí.
# Puerto estándar: 8761
# ============================================================

server:
  port: 8761  # Puerto estándar para Eureka

spring:
  application:
    name: eureka-server  # Nombre con el que se identifica este servicio

# Configuración específica de Eureka Server
eureka:
  instance:
    hostname: localhost
  client:
    # El servidor NO se registra a sí mismo (es el servidor)
    register-with-eureka: false
    # El servidor NO busca otros servicios (él es el catálogo)
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Tiempo de espera antes de eliminar un servicio que no responde (ms)
    eviction-interval-timer-in-ms: 5000
    # Deshabilitar modo protegido (solo para desarrollo)
    enable-self-preservation: false

# Logs para ver qué servicios se registran
logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG