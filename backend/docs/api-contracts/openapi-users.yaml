openapi: 3.0.0
info:
  title: Users Microservice API
  description: Manages user authentication, registration, and user profile management
  version: 1.0.0
  contact:
    name: Systems Engineering Team

servers:
  - url: http://localhost:8080/api/users
    description: Local development server

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      summary: User login
      description: Authenticate user with credentials and return JWT token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      summary: User registration
      description: Register a new user (ADMINISTRADOR role only)
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profile:
    get:
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information
      operationId: getProfile
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /list:
    get:
      summary: List all users
      description: Retrieve all users (ADMINISTRADOR role only)
      operationId: listUsers
      parameters:
        - name: role
          in: query
          description: Filter by role (ADMINISTRADOR, FUNCIONARIO, AUDITOR)
          required: false
          schema:
            type: string
            enum: [ADMINISTRADOR, FUNCIONARIO, AUDITOR]
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of results to skip for pagination
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /update:
    put:
      summary: Update user profile
      description: Update the authenticated user's profile information (limited fields)
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /delete/{userId}:
    delete:
      summary: Delete user
      description: Delete a user by ID (ADMINISTRADOR role only)
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          description: UUID of the user to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: User login username
        password:
          type: string
          minLength: 6
          maxLength: 128
          description: User password (plain text, hashed on server)

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          $ref: '#/components/schemas/UserResponse'

    RegisterRequest:
      type: object
      required:
        - username
        - password
        - email
        - fullName
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Unique username for login
        password:
          type: string
          minLength: 6
          maxLength: 128
          description: User password (will be hashed with SHA-512)
        email:
          type: string
          format: email
          description: User email address (must be unique)
        fullName:
          type: string
          maxLength: 255
          description: Full name of the user
        role:
          type: string
          enum: [ADMINISTRADOR, FUNCIONARIO, AUDITOR]
          description: User role (no multirol support)

    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address (if updating)
        fullName:
          type: string
          maxLength: 255
          description: Full name (if updating)

    UserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: Unique user identifier
        username:
          type: string
          description: User login username
        email:
          type: string
          format: email
          description: User email address
        fullName:
          type: string
          description: User's full name
        role:
          type: string
          enum: [ADMINISTRADOR, FUNCIONARIO, AUDITOR]
          description: User role
        isActive:
          type: boolean
          description: Whether the user account is active
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp (UTC)
        lastLogin:
          type: string
          format: date-time
          nullable: true
          description: Last successful login timestamp (UTC, null if never logged in)

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp (UTC)
