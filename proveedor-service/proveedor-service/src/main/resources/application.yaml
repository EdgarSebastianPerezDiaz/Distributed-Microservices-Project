spring:
  application:
    name: SERVICIO-PROVEEDORES

  datasource:
    url: jdbc:postgresql://localhost:5432/proveedores_db
    username: postgres
    password: Admin123

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8082

# FIX HC-2: Configuración JWT SIMÉTRICO (HS512)
jwt:
  secret: mi-clave-super-secreta-para-jwt-de-512-bits-minimo-requerido-para-firmar-tokens-seguros-en-el-sistema-de-contratos-uptc-2026

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Supplier Management Microservice
    version: 1.0.0

logging:
  level:
    com.example.proveedorservice: DEBUG
    org.springframework.cloud: INFO

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
