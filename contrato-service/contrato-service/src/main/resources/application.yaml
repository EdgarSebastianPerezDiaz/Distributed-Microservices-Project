spring:
  application:
    name: servicio-contratos

  datasource:
    url: jdbc:postgresql://localhost:5432/contratos_db
    username: postgres
    password: Admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Contract Management Microservice
    version: 1.0.0

logging:
  level:
    com.example.contratoservice: DEBUG
    org.springframework.cloud: INFO

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000

# URL del servicio de proveedores (para Feign)
supplier:
  service:
    url: http://localhost:8082
