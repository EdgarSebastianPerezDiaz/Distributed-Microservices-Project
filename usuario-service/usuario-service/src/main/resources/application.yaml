# ============================================================
# USUARIO SERVICE - MICROSERVICIO DE AUTENTICACIÓN
# ============================================================

server:
  port: 8084

spring:
  application:
    name: usuario-service
  
  # Configuración de Base de Datos PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/db_usuarios
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  
  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Eureka Client - IGUAL que servicio-proveedores
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true  # ← IGUAL que los otros servicios
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Logging
logging:
  level:
    com.distribuidos.usuario_service: DEBUG
    org.springframework.cloud: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always