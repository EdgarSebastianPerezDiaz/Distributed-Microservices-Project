openapi: 3.0.0
info:
  title: Suppliers Microservice API
  description: Manages supplier information and supplier lifecycle
  version: 1.0.0
  contact:
    name: Systems Engineering Team

servers:
  - url: http://localhost:8081/api/suppliers
    description: Local development server

security:
  - BearerAuth: []

paths:
  /create:
    post:
      summary: Create a new supplier
      description: Register a new supplier (ADMINISTRADOR or FUNCIONARIO roles)
      operationId: createSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierRequest'
      responses:
        '201':
          description: Supplier created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Invalid request body or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /list:
    get:
      summary: List all suppliers
      description: Retrieve all suppliers with optional filtering and pagination
      operationId: listSuppliers
      parameters:
        - name: status
          in: query
          description: Filter by supplier status (ACTIVE, INACTIVE, SUSPENDED)
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
        - name: search
          in: query
          description: Search by supplier name or business ID
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of results to skip for pagination
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: List of suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{supplierId}:
    get:
      summary: Get supplier by ID
      description: Retrieve detailed information about a specific supplier
      operationId: getSupplier
      parameters:
        - name: supplierId
          in: path
          description: UUID of the supplier
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Invalid supplier ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /update/{supplierId}:
    put:
      summary: Update supplier information
      description: Update supplier details (ADMINISTRADOR or FUNCIONARIO roles)
      operationId: updateSupplier
      parameters:
        - name: supplierId
          in: path
          description: UUID of the supplier to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierRequest'
      responses:
        '200':
          description: Supplier updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Invalid request or supplier ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deactivate/{supplierId}:
    patch:
      summary: Deactivate a supplier
      description: Mark a supplier as inactive (soft delete, ADMINISTRADOR only)
      operationId: deactivateSupplier
      parameters:
        - name: supplierId
          in: path
          description: UUID of the supplier to deactivate
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Invalid supplier ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only ADMINISTRADOR can deactivate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    CreateSupplierRequest:
      type: object
      required:
        - supplierName
        - businessId
        - email
        - phone
        - address
        - city
        - country
      properties:
        supplierName:
          type: string
          maxLength: 255
          description: Official supplier/company name
        businessId:
          type: string
          maxLength: 50
          description: Business registration ID (tax ID, NIT, etc.)
        email:
          type: string
          format: email
          description: Supplier contact email
        phone:
          type: string
          maxLength: 20
          description: Supplier contact phone number
        address:
          type: string
          maxLength: 255
          description: Physical address
        city:
          type: string
          maxLength: 100
          description: City name
        country:
          type: string
          maxLength: 100
          description: Country name
        bankAccount:
          type: string
          maxLength: 50
          nullable: true
          description: Supplier bank account (optional)

    UpdateSupplierRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Supplier contact email (if updating)
        phone:
          type: string
          maxLength: 20
          description: Supplier phone (if updating)
        address:
          type: string
          maxLength: 255
          description: Physical address (if updating)
        city:
          type: string
          maxLength: 100
          description: City name (if updating)
        country:
          type: string
          maxLength: 100
          description: Country name (if updating)
        bankAccount:
          type: string
          maxLength: 50
          nullable: true
          description: Bank account (if updating)

    SupplierResponse:
      type: object
      properties:
        supplierId:
          type: string
          format: uuid
          description: Unique supplier identifier
        supplierName:
          type: string
          description: Official supplier name
        businessId:
          type: string
          description: Business registration ID
        email:
          type: string
          format: email
          description: Supplier email
        phone:
          type: string
          description: Supplier phone
        address:
          type: string
          description: Physical address
        city:
          type: string
          description: City
        country:
          type: string
          description: Country
        bankAccount:
          type: string
          nullable: true
          description: Bank account
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
          description: Supplier status
        createdAt:
          type: string
          format: date-time
          description: Supplier registration timestamp (UTC)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC)

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp (UTC)
