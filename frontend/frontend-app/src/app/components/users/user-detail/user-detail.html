<div class="detail-container">
  <div class="detail-header">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>Detalles del Usuario</h2>
    <button mat-raise-button color="primary" (click)="editUser()">
      <mat-icon>edit</mat-icon>
      <span>Editar</span>
    </button>
  </div>

  <div class="detail-content" *ngIf="!loading && user">
    <mat-card>
      <mat-card-content>
        <div class="info-grid">
          <div class="info-item">
            <label>Usuario</label>
            <p>{{ user.username }}</p>
          </div>
          <div class="info-item">
            <label>Email</label>
            <p>{{ user.email }}</p>
          </div>
          <div class="info-item">
            <label>Nombre Completo</label>
            <p>{{ user.fullName || '-' }}</p>
          </div>
          <div class="info-item">
            <label>Rol</label>
            <p>
              <mat-chip-set aria-label="Role">
                <mat-chip>{{ user.role }}</mat-chip>
              </mat-chip-set>
            </p>
          </div>
          <div class="info-item">
            <label>Estado</label>
            <p>
              <mat-chip-set aria-label="Status">
                <mat-chip [highlighted]="user.status === UserStatus.ACTIVO">
                  {{ user.status }}
                </mat-chip>
              </mat-chip-set>
            </p>
          </div>
          <div class="info-item" *ngIf="user.createdAt">
            <label>Creado</label>
            <p>{{ user.createdAt | date: 'medium' }}</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-spinner *ngIf="loading" diameter="40"></mat-spinner>

  <div class="error-message" *ngIf="error">
    <mat-icon>error</mat-icon>
    <span>{{ error }}</span>
  </div>
</div>
