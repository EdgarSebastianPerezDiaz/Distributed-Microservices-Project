<mat-toolbar color="primary" class="navbar">
  <div class="navbar-content">
    <div class="navbar-brand">
      <mat-icon class="logo-icon">dashboard</mat-icon>
      <span class="brand-name">Gestión de Proveedores</span>
    </div>

    <nav class="navbar-nav" *ngIf="currentUser">
      <!-- Admin Navigation -->
      <a mat-button routerLink="/users" routerLinkActive="active" *ngIf="isAdmin()">
        <mat-icon>people</mat-icon>
        <span>Usuarios</span>
      </a>
      <a mat-button routerLink="/suppliers" routerLinkActive="active">
        <mat-icon>business</mat-icon>
        <span>Proveedores</span>
      </a>
      <a mat-button routerLink="/contratos" routerLinkActive="active">
        <mat-icon>description</mat-icon>
        <span>Contratos</span>
      </a>
      <a mat-button routerLink="/auditoria" routerLinkActive="active" *ngIf="isAuditor()">
        <mat-icon>security_audit</mat-icon>
        <span>Auditoría</span>
      </a>
    </nav>

    <div class="navbar-user" *ngIf="currentUser">
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <div mat-menu-item class="user-info">
          <strong>{{ currentUser.fullName || currentUser.username }}</strong>
          <small>{{ currentUser.role }}</small>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Configuración</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
