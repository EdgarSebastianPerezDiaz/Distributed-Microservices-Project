<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Inicio de Sesión</mat-card-title>
      <mat-card-subtitle>Ingresa tus credenciales para acceder</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- Error Alert -->
      <div class="error-message" *ngIf="error">
        <mat-icon class="error-icon">error</mat-icon>
        <span>{{ error }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Username Field -->
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Usuario</mat-label>
          <input
            matInput
            formControlName="username"
            placeholder="Ingresa tu usuario"
            [disabled]="loading"
          />
          <mat-error *ngIf="f['username'].hasError('required')">
            El usuario es obligatorio
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            [disabled]="loading"
          />
          <mat-error *ngIf="f['password'].hasError('required')">
            La contraseña es obligatoria
          </mat-error>
          <mat-error *ngIf="f['password'].hasError('minlength')">
            La contraseña debe tener al menos 6 caracteres
          </mat-error>
        </mat-form-field>

        <!-- Submit Button -->
        <button
          mat-raised-button
          color="primary"
          class="full-width submit-button"
          [disabled]="loading"
        >
          <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
          <span *ngIf="!loading">Ingresar</span>
        </button>
      </form>

      <div class="divider-row" aria-hidden="true">
        <span>o</span>
      </div>

      <div class="secondary-action">
        <div class="secondary-text">¿Necesitas crear una cuenta institucional?</div>
        <div class="secondary-hint">Abre el formulario para ingresar los datos del usuario.</div>
        <button
          mat-stroked-button
          color="primary"
          class="secondary-button"
          type="button"
          [disabled]="loading"
          (click)="goToRegister()"
        >
          Registrar usuario
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
