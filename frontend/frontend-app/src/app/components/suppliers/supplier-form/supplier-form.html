<div class="form-container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Editar Proveedor' : 'Nuevo Proveedor' }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="error-message" *ngIf="error">
        <mat-icon>error</mat-icon>
        <span>{{ error }}</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>NIT</mat-label>
          <input matInput formControlName="nit" placeholder="Ej. 123456789">
          <mat-error *ngIf="f['nit'].hasError('required')">El NIT es obligatorio</mat-error>
          <mat-error *ngIf="f['nit'].hasError('minlength')">Mínimo 8 dígitos</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Razón Social</mat-label>
          <input matInput formControlName="businessName" placeholder="Nombre de la empresa">
          <mat-error *ngIf="f['businessName'].hasError('required')">La razón social es obligatoria</mat-error>
          <mat-error *ngIf="f['businessName'].hasError('minlength')">Mínimo 3 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="correo@empresa.com">
          <mat-error *ngIf="f['email'].hasError('required')">El email es obligatorio</mat-error>
          <mat-error *ngIf="f['email'].hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phone" placeholder="Ej. +57 1 2345678">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tipo de Persona</mat-label>
          <mat-select formControlName="personType">
            <mat-option *ngFor="let type of personTypes" [value]="type">
              {{ type }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="f['personType'].hasError('required')">El tipo de persona es obligatorio</mat-error>
        </mat-form-field>

        <div class="button-group">
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
            <mat-icon>save</mat-icon>
            <span>{{ isEditMode ? 'Actualizar' : 'Crear' }}</span>
          </button>
          <button mat-stroked-button type="button" (click)="onCancel()">
            <mat-icon>cancel</mat-icon>
            <span>Cancelar</span>
          </button>
        </div>
      </form>

      <mat-spinner *ngIf="loading" diameter="40"></mat-spinner>
    </mat-card-content>
  </mat-card>
</div>
