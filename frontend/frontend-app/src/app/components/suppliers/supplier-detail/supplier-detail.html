<div class="detail-container">
  <div class="detail-header">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>Detalles del Proveedor</h2>
    <button mat-raised-button color="primary" (click)="editSupplier()" *ngIf="isAdmin()">
      <mat-icon>edit</mat-icon>
      <span>Editar</span>
    </button>
  </div>

  <div class="detail-content" *ngIf="!loading && supplier">
    <mat-card>
      <mat-card-content>
        <div class="info-grid">
          <div class="info-item">
            <label>NIT</label>
            <p>{{ supplier.nit }}</p>
          </div>
          <div class="info-item">
            <label>Razón Social</label>
            <p>{{ supplier.businessName }}</p>
          </div>
          <div class="info-item">
            <label>Email</label>
            <p>{{ supplier.email }}</p>
          </div>
          <div class="info-item">
            <label>Teléfono</label>
            <p>{{ supplier.phone || '-' }}</p>
          </div>
          <div class="info-item">
            <label>Tipo de Persona</label>
            <p>
              <mat-chip-set aria-label="Type">
                <mat-chip>{{ supplier.personType }}</mat-chip>
              </mat-chip-set>
            </p>
          </div>
          <div class="info-item">
            <label>Estado</label>
            <p>
              <mat-chip-set aria-label="Status">
                <mat-chip [highlighted]="supplier.status === SupplierStatus.HABILITADO">
                  {{ supplier.status }}
                </mat-chip>
              </mat-chip-set>
            </p>
          </div>
        </div>
        
        <mat-divider class="divider"></mat-divider>
        
        <div class="status-warning" *ngIf="supplier.status === SupplierStatus.INHABILITADO">
          <mat-icon>warning</mat-icon>
          <span>Este proveedor está INHABILITADO y no puede usarse en nuevos contratos</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-spinner *ngIf="loading" diameter="40"></mat-spinner>

  <div class="error-message" *ngIf="error">
    <mat-icon>error</mat-icon>
    <span>{{ error }}</span>
  </div>
</div>
